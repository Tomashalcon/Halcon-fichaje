<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halcon Supplies — Fichaje</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0efeb;
      --border: #e2e0d8; --text: #1a1917; --muted: #6b6860;
      --accent: #1a472a; --accent-light: #e8f0eb;
      --accent2: #1e3a5f; --accent2-light: #e8edf5;
      --danger: #7a1f1f; --danger-light: #fdf0f0;
      --gold: #c8a84b; --gold-light: #faf3e0;
      --radius: 10px; --radius-lg: 16px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .site-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo-mark { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .logo-mark svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo-text { font-size: 15px; font-weight: 600; }
    .logo-sub { font-size: 12px; color: var(--muted); }
    .header-user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
    .btn-logout { font-size: 12px; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; font-family: 'DM Sans', sans-serif; }

    /* VIEWS */
    .view { display: none; }

    /* REGISTRO */
    #view-registro { min-height: calc(100vh - 65px); align-items: center; justify-content: center; padding: 2rem 1rem; }
    #view-registro.active { display: flex; }
    .registro-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2rem; width: 100%; max-width: 380px; }
    .registro-card h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .registro-card p { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.5; }
    .field { margin-bottom: 1rem; }
    .field label { font-size: 12px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 5px; }
    .field input, .field select { width: 100%; padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 15px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); outline: none; }
    .field input:focus, .field select:focus { border-color: var(--accent); background: white; }
    .btn-primary { width: 100%; padding: 13px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; border: none; border-radius: var(--radius); background: var(--accent); color: white; cursor: pointer; margin-top: 0.5rem; }
    .btn-primary:hover { background: #15381f; }
    .error-msg { font-size: 12px; color: var(--danger); margin-top: 8px; display: none; }

    /* ADMIN */
    #view-admin { padding: 1.5rem; max-width: 960px; margin: 0 auto; }
    #view-admin.active { display: block; }
    .section-title { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
    .branches-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .branch-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .branch-badge { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); background: var(--accent-light); padding: 3px 10px; border-radius: 100px; }
    .branch-name { font-size: 17px; font-weight: 600; text-align: center; }
    .branch-addr { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
    .qr-box { background: white; padding: 14px; border-radius: var(--radius); border: 1px solid var(--border); }
    .qr-url { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); text-align: center; word-break: break-all; padding: 6px 8px; background: var(--surface2); border-radius: 6px; width: 100%; }

    /* ENCARGADO */
    #view-encargado { padding: 1.5rem; max-width: 680px; margin: 0 auto; }
    #view-encargado.active { display: block; }
    .enc-header { margin-bottom: 1.5rem; }
    .enc-header h2 { font-size: 20px; font-weight: 600; }
    .registros-table { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .table-header { display: grid; grid-template-columns: 1fr 80px 80px 90px; padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; background: var(--surface2); border-bottom: 1px solid var(--border); }
    .table-row { display: grid; grid-template-columns: 1fr 80px 80px 90px; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); align-items: center; }
    .table-row:last-child { border-bottom: none; }
    .table-row:nth-child(even) { background: #fafaf8; }
    .tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 100px; }
    .tag-ent { background: var(--accent-light); color: var(--accent); }
    .tag-sal { background: var(--accent2-light); color: var(--accent2); }
    .empty-state { padding: 2rem; text-align: center; color: var(--muted); font-size: 14px; }
    .date-filter { display: flex; gap: 8px; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
    .date-filter input { padding: 8px 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); outline: none; }
    .btn-sec { padding: 8px 14px; font-family: 'DM Sans', sans-serif; font-size: 13px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius); cursor: pointer; }
    .btn-sec:hover { background: var(--surface2); }

    /* CHECKIN */
    #view-checkin { min-height: calc(100vh - 65px); flex-direction: column; align-items: center; padding: 2rem 1rem; gap: 1rem; }
    #view-checkin.active { display: flex; }
    .checkin-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; width: 100%; max-width: 380px; }
    .branch-header { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; text-align: center; }
    .branch-header .bname { font-size: 20px; font-weight: 600; }
    .branch-header .baddr { font-size: 13px; color: var(--muted); }
    .loc-pill { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; width: 100%; max-width: 380px; }
    .loc-wait { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .loc-ok { background: var(--accent-light); color: var(--accent); border: 1px solid #b6d4be; }
    .loc-err { background: var(--danger-light); color: var(--danger); border: 1px solid #f0b8b8; }
    .loc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .loc-wait .loc-dot { background: var(--muted); animation: pulse 1.5s infinite; }
    .loc-ok .loc-dot { background: var(--accent); }
    .loc-err .loc-dot { background: var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* BIG ACTION BUTTON */
    .btn-fichar {
      width: 100%; max-width: 380px;
      padding: 22px;
      font-family: 'DM Sans', sans-serif;
      font-size: 20px; font-weight: 700;
      border: none; border-radius: var(--radius-lg);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: -0.01em;
    }
    .btn-fichar:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-fichar:not(:disabled):active { transform: scale(0.97); }
    .btn-fichar.entrada { background: var(--accent); color: white; }
    .btn-fichar.salida { background: var(--accent2); color: white; }

    .registros-wrap { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .reg-header-row { padding: 10px 14px; font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; background: var(--surface2); border-bottom: 1px solid var(--border); }
    .reg-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
    .reg-item:last-child { border-bottom: none; }
    .reg-name { font-weight: 500; }
    .reg-meta { font-size: 12px; color: var(--muted); }
    .btn-back { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 6px 0; text-decoration: underline; }

    /* LOADING */
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 2rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: white; padding: 12px 20px; border-radius: var(--radius); font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap; z-index: 100; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    </div>
    <div>
      <div class="logo-text">Halcon Supplies</div>
      <div class="logo-sub">Sistema de fichaje</div>
    </div>
  </div>
  <div class="header-user" id="header-user" style="display:none;">
    <div class="avatar" id="header-avatar">?</div>
    <span id="header-name"></span>
    <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
  </div>
</header>

<!-- REGISTRO -->
<div id="view-registro" class="view">
  <div class="registro-card">
    <h2>Bienvenido/a</h2>
    <p>Primera vez usando el sistema. Ingresá tus datos para registrarte. Solo se hace una vez.</p>
    <div class="field">
      <label>Nombre completo</label>
      <input type="text" id="reg-nombre" placeholder="Ej: Juan García" autocomplete="name" />
    </div>
    <div class="field">
      <label>DNI</label>
      <input type="number" id="reg-dni" placeholder="Ej: 38456789" />
    </div>
    <div class="field">
      <label>Sucursal</label>
      <select id="reg-sucursal">
        <option value="">Seleccioná tu sucursal</option>
        <option value="quilmes">Quilmes</option>
        <option value="lomas">Lomas de Zamora</option>
        <option value="laplata">La Plata</option>
      </select>
    </div>
    <div class="error-msg" id="reg-error">Por favor completá todos los campos.</div>
    <button class="btn-primary" onclick="registrarUsuario()">Registrarme</button>
  </div>
</div>

<!-- ADMIN (QR panel) -->
<div id="view-admin" class="view">
  <div style="padding: 1.5rem 0 1rem;">
    <p class="section-title">Sucursales — QR de fichaje</p>
    <div class="branches-grid" id="branches-grid"></div>
  </div>
</div>

<!-- ENCARGADO -->
<div id="view-encargado" class="view">
  <div class="enc-header">
    <h2 id="enc-titulo">Registros</h2>
    <p id="enc-subtitulo" style="color:var(--muted);font-size:13px;margin-top:4px;"></p>
  </div>
  <div class="date-filter">
    <input type="date" id="enc-fecha" />
    <button class="btn-sec" onclick="renderEncargado()">Filtrar</button>
    <button class="btn-sec" onclick="filtrarHoy()">Hoy</button>
  </div>
  <div id="enc-loading" style="display:none;"><div class="spinner"></div></div>
  <div class="registros-table" id="enc-tabla"></div>
</div>

<!-- CHECKIN -->
<div id="view-checkin" class="view">
  <div class="checkin-card">
    <div class="branch-header">
      <div class="branch-badge" style="font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-light);padding:3px 10px;border-radius:100px;">Sucursal</div>
      <div class="bname" id="ci-name">—</div>
      <div class="baddr" id="ci-addr">—</div>
    </div>
    <div style="text-align:center;">
      <div style="font-size:13px;color:var(--muted);">Fichando como</div>
      <div style="font-size:16px;font-weight:600;" id="ci-empleado">—</div>
    </div>
  </div>

  <div class="loc-pill loc-wait" id="loc-status">
    <div class="loc-dot"></div>
    <span id="loc-text">Verificando ubicación GPS...</span>
  </div>

  <button class="btn-fichar entrada" id="btn-fichar" disabled onclick="fichar()">
    <span id="btn-fichar-label">↑ Registrar entrada</span>
  </button>

  <div class="registros-wrap" id="registros-wrap" style="display:none;">
    <div class="reg-header-row">Tus registros de hoy</div>
    <div id="reg-items"></div>
  </div>

  <button class="btn-back" onclick="volverInicio()">← Inicio</button>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA5LHfzVf-jcTCf4GtTqD8CmJjziTLcu-M",
  authDomain: "halcon-fichaje.firebaseapp.com",
  databaseURL: "https://halcon-fichaje-default-rtdb.firebaseio.com",
  projectId: "halcon-fichaje",
  storageBucket: "halcon-fichaje.firebasestorage.app",
  messagingSenderId: "1082124632584",
  appId: "1:1082124632584:web:2f7662db0d9af7af8147bd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const BASE_URL = 'https://project-pht7z.vercel.app/';
const RADIO = 30;

const SUCURSALES = [
  { id: 'lomas',   nombre: 'Lomas de Zamora', direccion: 'España 185, entre Loria y Gorriti',               lat: -34.7628408, lng: -58.4001215 },
  { id: 'quilmes', nombre: 'Quilmes',          direccion: 'Av. Mitre 980, entre Matienzo y Ortiz de Ocampo', lat: -34.7265727, lng: -58.2500608 },
  { id: 'laplata', nombre: 'La Plata',         direccion: 'Calle 48 N°675, entre 8 y 9',                     lat: -34.9150995, lng: -57.9528797 }
];

const EMPLEADOS_VALIDOS = [
  { nombre: 'Francisco', sucursal: 'quilmes', rol: 'empleado' },
  { nombre: 'Tomas',     sucursal: 'quilmes', rol: 'encargado' },
  { nombre: 'Alan',      sucursal: 'lomas',   rol: 'empleado' },
  { nombre: 'Marcos',    sucursal: 'lomas',   rol: 'empleado' },
  { nombre: 'Abel',      sucursal: 'lomas',   rol: 'encargado' },
  { nombre: 'Marina',    sucursal: 'laplata', rol: 'encargado' },
  { nombre: 'Milagros',  sucursal: 'laplata', rol: 'empleado' },
  { nombre: 'Teo',       sucursal: 'laplata', rol: 'empleado' },
  { nombre: 'Julian',    sucursal: 'laplata', rol: 'empleado' },
];

let usuarioActual = JSON.parse(localStorage.getItem('halcon_usuario') || 'null');
let sucursalActiva = null;
let gpsOk = false;
let encListenerOff = null;
let misRegistrosHoy = [];

// ── UTILS ──
function mostrarView(id) {
  document.querySelectorAll('.view').forEach(v => {
    v.classList.remove('active');
    v.style.display = 'none';
  });
  const t = document.getElementById(id);
  t.style.display = '';
  t.classList.add('active');
}

function actualizarHeader() {
  const hu = document.getElementById('header-user');
  if (usuarioActual) {
    hu.style.display = 'flex';
    document.getElementById('header-avatar').textContent = usuarioActual.nombre.charAt(0).toUpperCase();
    document.getElementById('header-name').textContent = usuarioActual.nombre;
  } else {
    hu.style.display = 'none';
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function distancia(la1, lo1, la2, lo2) {
  const R = 6371000, r = Math.PI / 180;
  const dLa = (la2-la1)*r, dLo = (lo2-lo1)*r;
  const a = Math.sin(dLa/2)**2 + Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function fechaHoy() {
  return new Date().toLocaleDateString('es-AR');
}

// ── INIT ──
function init() {
  const sid = new URLSearchParams(window.location.search).get('s');
  actualizarHeader();

  if (sid) {
    const s = SUCURSALES.find(x => x.id === sid);
    if (!s) { goInicio(); return; }
    sucursalActiva = s;
    if (!usuarioActual) {
      mostrarView('view-registro');
      const sel = document.getElementById('reg-sucursal');
      sel.value = sid; sel.disabled = true;
    } else {
      mostrarCheckin(s);
    }
  } else {
    goInicio();
  }
}

function goInicio() {
  if (!usuarioActual) { mostrarView('view-registro'); return; }
  if (usuarioActual.rol === 'encargado') { mostrarEncargado(); }
  else { mostrarView('view-admin'); renderAdmin(); }
}

// ── REGISTRO ──
window.registrarUsuario = function() {
  const nombre = document.getElementById('reg-nombre').value.trim();
  const dni    = document.getElementById('reg-dni').value.trim();
  const suc    = document.getElementById('reg-sucursal').value;
  const errEl  = document.getElementById('reg-error');

  if (!nombre || !dni || !suc) { errEl.style.display='block'; errEl.textContent='Por favor completá todos los campos.'; return; }
  if (dni.length < 7 || dni.length > 8) { errEl.style.display='block'; errEl.textContent='El DNI debe tener entre 7 y 8 dígitos.'; return; }

  const match = EMPLEADOS_VALIDOS.find(e =>
    e.sucursal === suc && e.nombre.toLowerCase() === nombre.toLowerCase()
  );
  if (!match) { errEl.style.display='block'; errEl.textContent='No encontramos tu nombre en esa sucursal. Verificá con tu encargado.'; return; }

  errEl.style.display = 'none';
  usuarioActual = { nombre: match.nombre, dni, sucursal: suc, rol: match.rol };
  localStorage.setItem('halcon_usuario', JSON.stringify(usuarioActual));
  actualizarHeader();
  showToast('¡Bienvenido/a, ' + match.nombre + '!');
  setTimeout(() => {
    if (sucursalActiva) mostrarCheckin(sucursalActiva);
    else goInicio();
  }, 700);
};

// ── LOGOUT ──
window.cerrarSesion = function() {
  if (!confirm('¿Cerrar sesión?')) return;
  localStorage.removeItem('halcon_usuario');
  usuarioActual = null;
  actualizarHeader();
  document.getElementById('reg-sucursal').disabled = false;
  mostrarView('view-registro');
};

// ── ADMIN QR ──
function renderAdmin() {
  const QRCode = window.QRCode;
  const grid = document.getElementById('branches-grid');
  grid.innerHTML = '';
  SUCURSALES.forEach(s => {
    const url = BASE_URL + '?s=' + s.id;
    const card = document.createElement('div');
    card.className = 'branch-card';
    card.innerHTML = `
      <span class="branch-badge">Sucursal</span>
      <div class="branch-name">${s.nombre}</div>
      <div class="branch-addr">${s.direccion}</div>
      <div class="qr-box" id="qr-${s.id}"></div>
      <div class="qr-url">${url}</div>
    `;
    grid.appendChild(card);
    setTimeout(() => {
      new QRCode(document.getElementById('qr-' + s.id), {
        text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.H
      });
    }, 80);
  });
}

// ── ENCARGADO ──
function mostrarEncargado() {
  mostrarView('view-encargado');
  const s = SUCURSALES.find(x => x.id === usuarioActual.sucursal);
  document.getElementById('enc-titulo').textContent = 'Registros — ' + (s ? s.nombre : '');
  document.getElementById('enc-subtitulo').textContent = 'Encargado: ' + usuarioActual.nombre;
  filtrarHoy();
}

window.filtrarHoy = function() {
  document.getElementById('enc-fecha').value = new Date().toISOString().split('T')[0];
  renderEncargado();
};

window.renderEncargado = function() {
  const fechaInput = document.getElementById('enc-fecha').value;
  let fechaFiltro = fechaHoy();
  if (fechaInput) {
    const d = new Date(fechaInput + 'T12:00:00');
    fechaFiltro = d.toLocaleDateString('es-AR');
  }

  if (encListenerOff) { encListenerOff(); encListenerOff = null; }

  document.getElementById('enc-loading').style.display = 'block';
  document.getElementById('enc-tabla').innerHTML = '';

  // Traer TODOS los registros de la sucursal sin filtrar por empleado
  const r = ref(db, 'registros');
  const q = query(r, orderByChild('sucursal'), equalTo(usuarioActual.sucursal));

  encListenerOff = onValue(q, snapshot => {
    document.getElementById('enc-loading').style.display = 'none';
    const items = [];
    snapshot.forEach(child => {
      const d = child.val();
      // Solo filtrar por fecha, NO por empleado
      if (d.fecha === fechaFiltro) items.push(d);
    });
    items.sort((a,b) => b.id - a.id);

    const tabla = document.getElementById('enc-tabla');
    if (!items.length) {
      tabla.innerHTML = '<div class="empty-state">No hay registros para esta fecha.</div>';
      return;
    }
    tabla.innerHTML = `
      <div class="table-header"><div>Empleado</div><div>Fecha</div><div>Hora</div><div>Tipo</div></div>
      ${items.map(r => `
        <div class="table-row">
          <div>${r.empleado}</div>
          <div style="font-size:12px;color:var(--muted)">${r.fecha}</div>
          <div style="font-family:'DM Mono',monospace;font-size:13px">${r.hora}</div>
          <div><span class="tag ${r.tipo==='entrada'?'tag-ent':'tag-sal'}">${r.tipo==='entrada'?'Entrada':'Salida'}</span></div>
        </div>
      `).join('')}
    `;
  });
};

// ── CHECKIN ──
function mostrarCheckin(s) {
  mostrarView('view-checkin');
  document.getElementById('ci-name').textContent = s.nombre;
  document.getElementById('ci-addr').textContent = s.direccion;
  document.getElementById('ci-empleado').textContent = usuarioActual ? usuarioActual.nombre : '—';
  gpsOk = false;

  // Cargar mis registros de hoy para saber si el próximo es entrada o salida
  cargarMisRegistros(s.id, () => {
    actualizarBotonFichar();
    document.getElementById('btn-fichar').disabled = true; // esperar GPS
  });

  setLoc('wait', 'Verificando ubicación GPS...');
  obtenerGPS(s);
}

function cargarMisRegistros(sid, cb) {
  const r = ref(db, 'registros');
  const q = query(r, orderByChild('sucursal'), equalTo(sid));
  onValue(q, snapshot => {
    const hoy = fechaHoy();
    misRegistrosHoy = [];
    snapshot.forEach(child => {
      const d = child.val();
      if (d.fecha === hoy && d.empleado === usuarioActual.nombre) misRegistrosHoy.push(d);
    });
    misRegistrosHoy.sort((a,b) => a.id - b.id);
    actualizarBotonFichar();
    renderMisRegistros();
    if (cb) { cb(); cb = null; }
  }, { onlyOnce: false });
}

function actualizarBotonFichar() {
  const btn = document.getElementById('btn-fichar');
  const lbl = document.getElementById('btn-fichar-label');
  // Próximo tipo: si el último fue entrada → salida, si no → entrada
  const ultimo = misRegistrosHoy[misRegistrosHoy.length - 1];
  const proximoTipo = (!ultimo || ultimo.tipo === 'salida') ? 'entrada' : 'salida';

  btn.className = 'btn-fichar ' + proximoTipo;
  lbl.textContent = proximoTipo === 'entrada' ? '↑ Registrar entrada' : '↓ Registrar salida';
  window._proximoTipo = proximoTipo;
}

window.fichar = function() {
  if (!gpsOk || !usuarioActual) return;
  const tipo = window._proximoTipo || 'entrada';
  const now = new Date();
  const registro = {
    id: now.getTime(),
    sucursal: sucursalActiva.id,
    empleado: usuarioActual.nombre,
    dni: usuarioActual.dni,
    tipo,
    hora: now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }),
    fecha: fechaHoy()
  };

  push(ref(db, 'registros'), registro).then(() => {
    showToast(tipo === 'entrada' ? '✓ Entrada registrada' : '✓ Salida registrada');
    // Deshabilitar hasta nuevo escaneo
    document.getElementById('btn-fichar').disabled = true;
    gpsOk = false;
    setLoc('ok', tipo === 'entrada' ? '✓ Entrada registrada. Hasta luego!' : '✓ Salida registrada. ¡Hasta mañana!');
  }).catch(() => {
    showToast('Error al guardar. Verificá tu conexión.');
  });
};

function renderMisRegistros() {
  const wrap = document.getElementById('registros-wrap');
  const cont = document.getElementById('reg-items');
  if (!misRegistrosHoy.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const sorted = [...misRegistrosHoy].reverse();
  cont.innerHTML = sorted.map(r => `
    <div class="reg-item">
      <div><div class="reg-name">${r.empleado}</div><div class="reg-meta">${r.fecha}</div></div>
      <div style="text-align:right">
        <div style="font-family:'DM Mono',monospace;font-size:13px">${r.hora}</div>
        <span class="tag ${r.tipo==='entrada'?'tag-ent':'tag-sal'}">${r.tipo==='entrada'?'Entrada':'Salida'}</span>
      </div>
    </div>
  `).join('');
}

// ── GPS ──
function setLoc(estado, msg) {
  document.getElementById('loc-status').className = 'loc-pill loc-' + estado;
  document.getElementById('loc-text').textContent = msg;
}

function obtenerGPS(s) {
  if (!navigator.geolocation) { setLoc('err', 'Tu navegador no soporta GPS'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const d = distancia(pos.coords.latitude, pos.coords.longitude, s.lat, s.lng);
      const dm = Math.round(d);
      if (d <= RADIO) {
        gpsOk = true;
        setLoc('ok', `Ubicación verificada ✓ — estás a ${dm}m del local`);
        document.getElementById('btn-fichar').disabled = false;
      } else {
        setLoc('err', `Fuera de rango — estás a ${dm}m del local (máx. ${RADIO}m)`);
      }
    },
    () => setLoc('err', 'No se pudo obtener GPS. Activá el permiso de ubicación.'),
    { enableHighAccuracy: true, timeout: 12000 }
  );
}

window.volverInicio = function() {
  history.pushState({}, '', BASE_URL);
  sucursalActiva = null;
  if (encListenerOff) { encListenerOff(); encListenerOff = null; }
  goInicio();
};

// Cargar QRCode lib y arrancar
const s = document.createElement('script');
s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
s.onload = init;
document.head.appendChild(s);

window.addEventListener('popstate', init);
</script>
